name: smartcane_app
description: SmartCaneApp - Flutter port of the Guardian dashboard tabs.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  ionicons_plus: ^0.2.4

  # Backend — same Supabase project as the RN app
  supabase_flutter: ^2.5.6

  # Local key/value storage — equivalent of @react-native-async-storage/async-storage
  shared_preferences: ^2.2.3

  # HTTP calls — used for the Google reverse-geocoding lookup, same as RN's fetch()
  http: ^1.2.1

  # Push notifications — Expo's push service doesn't exist outside Expo, so the
  # Flutter equivalent is Firebase Cloud Messaging. See push_notification_service.dart.
  firebase_core: ^3.3.0

  # Date/time formatting — equivalent of toLocaleTimeString()
  intl: ^0.19.0

  # Opening external links — equivalent of RN's Linking.openURL()
  url_launcher: ^6.3.0

  cupertino_icons: ^1.0.6

  google_maps_flutter: ^2.9.0
  image_picker: ^1.1.2
  app_links: ^6.3.2
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.1.0
  geolocator: ^13.0.1
  flutter_background_service: ^5.0.10
  op_wifi_utils: ^1.5.0
  app_settings: ^7.0.0
  wifi_scan: ^0.4.1+2
  network_info_plus: ^8.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true